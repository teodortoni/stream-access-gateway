service: stream-access-gateway

plugins:
  - serverless-dotenv-plugin
  # - serverless-plugin-datadog
  - serverless-jetpack
  # Enable warmup on all functions (only for production and staging)
  # - serverless-plugin-warmup

custom:
  serverless-jetpack:
    mode: npm
  # Enable warmup on all functions (only for production and staging)
  # warmup:
  #   - production
  #   - staging
  # datadog:
  #   forwarder: arn:aws:lambda:ap-south-1:228212849651:function:datadog-forwarder-Forwarder-GH3BEQA6509Z

provider:
  name: aws
  runtime: nodejs12.x
  region: ${env:AWS_OWN_REGION, us-east-1}
  stage: ${env:AWS_OWN_STAGE, dev}
  vpc:
    securityGroupIds:
      - ${env:AWS_OWN_VPC_SECURITY_GROUP}
    subnetIds:
      - ${env:AWS_OWN_VPC_SUBNET_1}
      - ${env:AWS_OWN_VPC_SUBNET_2}
      - ${env:AWS_OWN_VPC_SUBNET_3}
      - ${env:AWS_OWN_VPC_SUBNET_4}

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            # - "s3:*"
            - "s3:ListAllMyBuckets"
            - "s3:ListBucket"
            - "s3:GetObject"
          Resource:
            # - "arn:aws:s3:::*"
            - "arn:aws:s3:::${env:FS3_BUCKET}"
            - "arn:aws:s3:::${env:FS3_BUCKET}/*"

package:
  exclude:
    - .git/**
    - .GitHub/**
    - config/**
    - coverage/**
    - scripts/**
    - src/**
    - test/**
    - .env.example
    - .eslintrc.js
    - .gitignore
    - .GitHub-ci.yml
    - .prettierrc
    - nest-cli.json
    - notes.js
    - ormconfig.json
    - tsconfig.build.json
    - tsconfig.json
    - README.md

functions:
  runstream-access-gateway:
    handler: dist/src/lambda.handler
    name: stream-access-gateway-${env:AWS_OWN_STAGE, dev}-${env:AWS_LAMBDA_NAME}
    timeout: 12
    events:
      - http:
          path: "/"
          method: any
          cors: true
      - http:
          path: "{proxy+}"
          method: any
          cors: true
  testrouter:
    handler: dist/src/testrouterHandler.handler
    events:
      - http:
          path: "/testrouter"
          method: get
          cors: true
